<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobbler's Great Getaway: The Thanksgiving Escape</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #11141b;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobbler's Great Getaway: The Thanksgiving Escape - Run, jump, slide, and hide to escape Farmer Barnaby Baste, the roasting oven, and flying carving knives!"></canvas>
<p id="status" role="status" aria-live="polite">Gobbler's Great Getaway loaded. Press Space or Click to begin your escape!</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
